[project]
name = "safe-bot"
version = "0.1.0"
description = "Telegram bot. Hozircha /start buyrug'ida salomlashadi."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "aiosqlite>=0.21",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[project.scripts]
safe-bot = "safe_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safe_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
